backend:
  name: github
  repo: personal-site-of-mine/nezrkaan-site
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://nezrkaan.com
display_url: https://nezrkaan.com

collections:
  # ─── FIELD NOTES — markdown writeups ───
  - name: "writeups"
    label: "Field Notes"
    label_singular: "Field Note"
    description: "Write a new note or edit an existing one. Title, kicker, dek, date go in the form. The body is Word-style — paste prose, click Image to upload, or click Add Component for snippets."
    folder: "writeups"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    preview_path: "writeups/{{slug}}"
    fields:
      - { label: "Browser title", name: "title", widget: "string", hint: "Shown in the browser tab. e.g. 'Shadow Bridge — Field Notes by Nezr Kaan'" }
      - { label: "Kicker", name: "kicker", widget: "string", hint: "e.g. 'Field Note № 005 — Audio OSINT'" }
      - { label: "Article title", name: "articleTitle", widget: "string", hint: "Shown as <h1> on the page. Short. e.g. 'Shadow Bridge'" }
      - { label: "Dek (subtitle)", name: "dek", widget: "string", hint: "One-line italic sub-title under the H1" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Tag (left-most chip)", name: "tag", widget: "string", default: "Bellingcat CTF" }
      - { label: "Type / sub-category", name: "type", widget: "string", hint: "e.g. 'Audio forensics', 'Image OSINT'" }
      - { label: "Read time", name: "readtime", widget: "string", default: "5 min read" }
      - { label: "Field note number", name: "number", widget: "string", hint: "e.g. '005' — used in the archive" }
      - { label: "Archive category", name: "category", widget: "string", hint: "Shown on the archive cards. e.g. 'Audio OSINT'" }
      - { label: "Archive title", name: "archive_title", widget: "string", hint: "Heading shown on the archive page card. Can differ from articleTitle." }
      - { label: "Excerpt (archive card)", name: "excerpt", widget: "text", hint: "Short summary shown on the archive page" }
      - { label: "Filter tags", name: "tags_for_filter", widget: "list", default: ["CTF", "Bellingcat"], hint: "Used by the archive filter chips. Add: CTF, Bellingcat, Investigation, Blog, News, or your own." }
      - { label: "SEO description", name: "description", widget: "text", hint: "Meta description for Google" }
      - { label: "Keywords", name: "keywords", widget: "string", required: false, hint: "Comma-separated, for SEO" }
      - { label: "Open Graph title", name: "ogTitle", widget: "string", required: false, hint: "Title when shared on LinkedIn / Twitter. Defaults to browser title." }
      - { label: "Open Graph description", name: "ogDescription", widget: "text", required: false, hint: "Description when shared. Defaults to SEO description." }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Word-style editor. Paste prose, drag in images, or click 'Add Component' for callouts and special blocks. See admin/SNIPPETS.md for the HTML cheat-sheet."
        editor_components:
          - "image"
          - "code-block"

  # ─── PAGES — home + archive (rarely edited) ───
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home"
        name: "home"
        fields:
          - { label: "Body (raw)", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups.html"
        label: "Archive"
        name: "archive"
        fields:
          - { label: "Body (raw)", name: "body", widget: "code", default_language: "html", output_code_only: true }

  # ─── REFERENCE — read-only snippet library ───
  - name: "reference"
    label: "Reference"
    description: "Snippet cheat-sheet for special components (try-callout, finding, evidence-link). Copy from here, paste into the body."
    files:
      - file: "admin/SNIPPETS.md"
        label: "Snippet library"
        name: "snippets"
        fields:
          - { label: "Content", name: "body", widget: "markdown" }
