backend:
  name: github
  repo: personal-site-of-mine/nezrkaan-site
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://nezrkaan.com
display_url: https://nezrkaan.com

collections:
  # ─── EXISTING WRITEUPS — edit raw HTML ───
  - name: "writeups"
    label: "Field Notes"
    label_singular: "Field Note"
    description: "Edit existing writeups. Use the image button in the toolbar to upload new images."
    files:
      - file: "writeups/window-seat.html"
        label: "Window Seat"
        name: "window-seat"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups/touching-tarmac.html"
        label: "Touching Tarmac"
        name: "touching-tarmac"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups/rapid-fire.html"
        label: "Rapid Fire"
        name: "rapid-fire"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups/urban-symphony.html"
        label: "Urban Symphony"
        name: "urban-symphony"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }

  # ─── PAGES — home + archive ───
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home"
        name: "home"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups.html"
        label: "Archive"
        name: "archive"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }

  # ─── REFERENCE — snippet library ───
  - name: "reference"
    label: "Reference"
    description: "Snippet library for components. Copy-paste into the HTML body when writing a new note."
    files:
      - file: "admin/SNIPPETS.md"
        label: "Snippet library"
        name: "snippets"
        fields:
          - { label: "Content", name: "body", widget: "markdown" }
