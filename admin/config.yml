backend:
  name: github
  repo: personal-site-of-mine/nezrkaan-site
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://nezrkaan.com
display_url: https://nezrkaan.com

collections:
  # ─── EXISTING WRITEUPS — edit raw HTML ───
  - name: "writeups"
    label: "Field Notes"
    label_singular: "Field Note"
    description: "Mevcut yazıları düzenle. Görsel yüklemek için body içinde 'Add component' kullan."
    files:
      - file: "writeups/window-seat.html"
        label: "Window Seat"
        name: "window-seat"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups/touching-tarmac.html"
        label: "Touching Tarmac"
        name: "touching-tarmac"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups/rapid-fire.html"
        label: "Rapid Fire"
        name: "rapid-fire"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups/urban-symphony.html"
        label: "Urban Symphony"
        name: "urban-symphony"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }

  # ─── PAGES — home + archive ───
  - name: "pages"
    label: "Sayfalar"
    files:
      - file: "index.html"
        label: "Anasayfa"
        name: "home"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }
      - file: "writeups.html"
        label: "Arşiv"
        name: "archive"
        fields:
          - { label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true }

  # ─── MEDIA — for image upload reference ───
  - name: "media"
    label: "📁 Görseller"
    description: "Görselleri buradan yükle. Yüklenince /images/uploads/ altına gider, URL'ini snippet'a yapıştır."
    files:
      - file: "admin/SNIPPETS.md"
        label: "Snippet kütüphanesi"
        name: "snippets"
        fields:
          - { label: "Markdown", name: "body", widget: "markdown" }
