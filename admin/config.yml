backend:
  name: github
  repo: personal-site-of-mine/nezrkaan-site
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://nezrkaan.com
display_url: https://nezrkaan.com

# Türkçe karakterli başlıklardan temiz dosya adı üret (ör. "Gölge Köprü" -> golge-kopru)
slug:
  encoding: ascii
  clean_accents: true

collections:
  # ─── FIELD NOTES — yazılar ───
  - name: "writeups"
    label: "Yazılar (Field Notes)"
    label_singular: "Yazı"
    description: >-
      Yeni yazı ekle veya mevcut olanı düzenle. Sadece Başlık ve Özet'i doldurup
      gövdeyi yazman yeterli — diğer her şey boş bırakılırsa otomatik üretilir.
      Yayınla'ya bastıktan 1-2 dakika sonra yazı sitede, arşivde ve ana sayfada
      kendiliğinden görünür.
    folder: "writeups"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    identifier_field: articleTitle
    slug: "{{slug}}"
    preview_path: "writeups/{{slug}}"
    summary: "{{fields.articleTitle}} — {{fields.date}}"
    sortable_fields: ["date", "articleTitle"]
    fields:
      - label: "Başlık"
        name: "articleTitle"
        widget: "string"
        hint: "Sayfadaki büyük başlık (H1). Kısa tut. ör. 'Shadow Bridge'"
      - label: "Tarih"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - label: "Alt başlık (dek)"
        name: "dek"
        widget: "string"
        required: false
        hint: "H1 altındaki tek satırlık italik cümle. İsteğe bağlı."
      - label: "Özet"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "Arşiv kartında ve Google'da görünen 1-2 cümlelik özet. Boşsa alt başlık kullanılır."
      - label: "Filtre etiketleri"
        name: "tags_for_filter"
        widget: "select"
        multiple: true
        options: ["CTF", "Bellingcat", "Investigation", "Blog", "News"]
        default: ["CTF", "Bellingcat"]
        hint: "Arşiv sayfasındaki filtre çipleri bunlara göre çalışır."
      - label: "Gövde"
        name: "body"
        widget: "markdown"
        hint: >-
          Word gibi yaz: metni yapıştır, görsel sürükle. Özel bloklar (Try-it,
          Part başlığı, Kanıt kartı, Cevap bloğu...) için editördeki + işaretine
          basıp bileşen seç.
        editor_components:
          - "lead"
          - "try-callout"
          - "part-header"
          - "image"
          - "figure"
          - "figure-pair"
          - "evidence-list"
          - "evidence-link"
          - "pullquote"
          - "dork"
          - "method-detail"
          - "finding"
          - "acknowledgement"
          - "end-mark"
          - "code-block"
      # ── İsteğe bağlı ayrıntılar — boş bırakılırsa otomatik üretilir ──
      - label: "Kart kategorisi"
        name: "category"
        widget: "string"
        required: false
        hint: "Arşiv kartındaki kategori. ör. 'Audio OSINT'. Boşsa alt kategori kullanılır."
      - label: "Alt kategori"
        name: "type"
        widget: "string"
        required: false
        hint: "Başlığın altındaki meta satırında görünür. ör. 'Audio forensics'"
      - label: "Etiket (sol çip)"
        name: "tag"
        widget: "string"
        required: false
        default: "Bellingcat CTF"
      - label: "Not numarası"
        name: "number"
        widget: "string"
        required: false
        hint: "ör. '006'. Boş bırak — tarih sırasına göre otomatik verilir."
      - label: "Kicker"
        name: "kicker"
        widget: "string"
        required: false
        hint: "H1 üstündeki satır. Boşsa 'Field Note № 006 — Kategori' şeklinde otomatik oluşur."
      - label: "Arşiv başlığı"
        name: "archive_title"
        widget: "string"
        required: false
        hint: "Arşiv kartındaki başlık, sayfa başlığından farklı olabilir. Boşsa Başlık kullanılır."
      - label: "Tarayıcı sekmesi başlığı"
        name: "title"
        widget: "string"
        required: false
        hint: "Boşsa 'Başlık — Field Notes by Nezr Kaan' otomatik oluşur."
      - label: "SEO açıklaması"
        name: "description"
        widget: "text"
        required: false
        hint: "Google'daki açıklama. Boşsa Özet kullanılır."
      - label: "Anahtar kelimeler (SEO)"
        name: "keywords"
        widget: "string"
        required: false
        hint: "Virgülle ayır."
      - label: "Paylaşım başlığı (Open Graph)"
        name: "ogTitle"
        widget: "string"
        required: false
        hint: "LinkedIn / Twitter'da paylaşınca görünen başlık. Boşsa sekme başlığı kullanılır."
      - label: "Paylaşım açıklaması (Open Graph)"
        name: "ogDescription"
        widget: "text"
        required: false
        hint: "Paylaşımda görünen açıklama. Boşsa SEO açıklaması kullanılır."

  # ─── SAYFALAR — bütün sabit sayfalar form alanlarıyla düzenlenir ───
  - name: "pages"
    label: "Sayfalar"
    description: >-
      Ana sayfa, arşiv ve 404 sayfasındaki bütün metinler buradan düzenlenir.
      'Sayfa şablonu' alanına normalde dokunmana gerek yok.
    files:
      - file: "index.html"
        label: "Ana Sayfa"
        name: "home"
        fields:
          - { label: "Üst etiket", name: "heroLabel", widget: "string", hint: "Büyük başlığın üstündeki küçük satır" }
          - { label: "Büyük başlık", name: "heroTitle", widget: "string", hint: "Bir kelimeyi eğik yazmak için <em>kelime</em> kullanabilirsin" }
          - { label: "Giriş paragrafı", name: "heroDescription", widget: "text" }
          - { label: "'Ne yapıyorum' bölüm etiketi", name: "whatIDoLabel", widget: "string" }
          - { label: "'Ne yapıyorum' metni", name: "whatIDoText", widget: "text" }
          - label: "Uzmanlık listesi"
            name: "focusList"
            widget: "list"
            field: { label: "Madde", name: "item", widget: "string" }
          - { label: "'Field Notes' bölüm etiketi", name: "fieldNotesLabel", widget: "string" }
          - { label: "'Field Notes' metni", name: "fieldNotesText", widget: "text", hint: "Son yazı kartı otomatik gelir — en yeni yazı kendiliğinden görünür." }
          - { label: "İletişim bölüm etiketi", name: "contactLabel", widget: "string" }
          - { label: "İletişim metni", name: "contactText", widget: "text" }
          - { label: "Tarayıcı sekmesi başlığı", name: "title", widget: "string" }
          - { label: "SEO açıklaması", name: "description", widget: "text" }
          - { label: "Anahtar kelimeler (SEO)", name: "keywords", widget: "string", required: false }
          - { label: "Paylaşım başlığı (Open Graph)", name: "ogTitle", widget: "string", required: false }
          - { label: "Paylaşım açıklaması (Open Graph)", name: "ogDescription", widget: "text", required: false }
          - { label: "Sayfa şablonu (ileri düzey — dokunma)", name: "body", widget: "code", default_language: "html", output_code_only: true, required: false }
      - file: "writeups.html"
        label: "Arşiv Sayfası"
        name: "archive"
        fields:
          - { label: "Üst etiket", name: "heroLabel", widget: "string" }
          - { label: "Büyük başlık", name: "heroTitle", widget: "string", hint: "Eğik kısım için <em>kelime</em> kullan" }
          - { label: "Giriş paragrafı", name: "heroDescription", widget: "text" }
          - { label: "Boş kategori mesajı", name: "emptyStateText", widget: "string", hint: "Bir filtrede hiç yazı yoksa görünen mesaj" }
          - { label: "Tarayıcı sekmesi başlığı", name: "title", widget: "string" }
          - { label: "SEO açıklaması", name: "description", widget: "text" }
          - { label: "Paylaşım başlığı (Open Graph)", name: "ogTitle", widget: "string", required: false }
          - { label: "Paylaşım açıklaması (Open Graph)", name: "ogDescription", widget: "text", required: false }
          - { label: "Sayfa şablonu (ileri düzey — dokunma)", name: "body", widget: "code", default_language: "html", output_code_only: true, required: false }
      - file: "404.html"
        label: "404 Sayfası"
        name: "notfound"
        fields:
          - { label: "Üst etiket", name: "heroLabel", widget: "string" }
          - { label: "Büyük başlık", name: "heroTitle", widget: "string", hint: "Eğik kısım için <em>kelime</em> kullan" }
          - { label: "Açıklama", name: "heroDescription", widget: "text" }
          - { label: "'Nereye?' bölüm etiketi", name: "nextLabel", widget: "string" }
          - { label: "Tarayıcı sekmesi başlığı", name: "title", widget: "string" }
          - { label: "SEO açıklaması", name: "description", widget: "text" }
          - { label: "Sayfa şablonu (ileri düzey — dokunma)", name: "body", widget: "code", default_language: "html", output_code_only: true, required: false }

  # ─── SİTE AYARLARI — başlık, slogan, linkler ───
  - name: "settings"
    label: "Site Ayarları"
    description: "Site adı, slogan, varsayılan SEO açıklaması ve profil linkleri."
    files:
      - file: "_data/site.json"
        label: "Genel Ayarlar"
        name: "site"
        fields:
          - { label: "Site adı", name: "title", widget: "string" }
          - { label: "Slogan", name: "tagline", widget: "string", hint: "Footer'da görünür" }
          - { label: "Varsayılan SEO açıklaması", name: "description", widget: "text" }
          - { label: "Site adresi", name: "url", widget: "string" }
          - { label: "Varsayılan paylaşım görseli", name: "ogImage", widget: "string" }
          - label: "Yazar"
            name: "author"
            widget: "object"
            fields:
              - { label: "İsim", name: "name", widget: "string" }
              - { label: "Profil adresi", name: "url", widget: "string" }
              - { label: "LinkedIn", name: "linkedin", widget: "string" }
              - { label: "Ko-fi (destek linki)", name: "kofi", widget: "string", required: false }
